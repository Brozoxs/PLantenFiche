<style>
:root{
  --ink:#16241B; --ink-60:#5A6960; --ink-35:#93A096;
  --paper:#EDF0E8; --card:#FFFFFF; --line:#DCE2D6;
  --wine:#5A1B3D; --bloom:#C4406B; --leaf:#4C7A46; --frost:#3A6E96;
  --display:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --body:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px; --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.app{
  position:relative;height:100%;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  max-width:560px;margin:0 auto;background:var(--paper)
}
.scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.03em}

/* ---------- chrome ---------- */
.wrap{padding:0 16px}
.top{padding:20px 0 4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-35)}
.date{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;margin-top:2px;letter-spacing:-.035em}

/* ---------- weather ---------- */
.weer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.chip{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;
  border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:14px;font-weight:500
}
.chip.sel{background:var(--wine);border-color:var(--wine);color:#fff}
.chip small{color:var(--ink-35);font-weight:400}
.chip.sel small{color:#E7C9D8}
.weerkeuze{display:flex;gap:6px;margin-top:10px}
.weerkeuze .chip{flex:1;justify-content:center;padding:0 6px;font-size:13px}

/* ---------- year strip ---------- */
.strip{display:flex;gap:3px;margin:16px 0 4px;height:34px;align-items:flex-end}
.seg{flex:1;position:relative;border-radius:4px 4px 2px 2px;background:#DFE5D9;height:14px;transition:height .25s}
.seg.past{background:#D2DACB}
.seg.now{background:var(--wine);height:26px}
.seg .pip{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--bloom)}
.striplbl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-35);letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}

/* ---------- section heads ---------- */
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:19px;font-weight:700}
.sec .count{font-size:13px;color:var(--ink-60)}

/* ---------- task card ---------- */
.taak{
  display:flex;gap:12px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px;
  transition:opacity .3s,transform .3s
}
.taak.gedaan{opacity:.45}
.taak img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#E4E9DE}
.taak .mid{flex:1;min-width:0}
.taak .nm{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;display:block;text-align:left}
.taak .sub{font-size:13px;color:var(--ink-60);margin-top:2px}
.taak .sub b{color:var(--wine);font-weight:600}
.doe{
  flex:none;min-width:var(--tap);height:var(--tap);width:var(--tap);border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;background:#FAFBF8
}
.doe svg{width:20px;height:20px;stroke:var(--ink-35);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.taak.gedaan .doe{background:var(--leaf);border-color:var(--leaf)}
.taak.gedaan .doe svg{stroke:#fff}

/* ---------- alert ---------- */
.alert{
  border-radius:var(--r);padding:14px 16px;margin-bottom:12px;
  background:#E4EDF3;border:1px solid #C3D7E4;color:#1E3C50
}
.alert.warm{background:#F6E9EE;border-color:#E4C6D2;color:#5A1B3D}
.alert h3{font-size:15px;font-weight:700;margin-bottom:3px}
.alert p{margin:0;font-size:14px;line-height:1.45}

.leeg{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
  padding:26px 18px;text-align:center
}
.leeg h3{font-size:17px;font-weight:700;margin-bottom:4px}
.leeg p{margin:0;font-size:14px;color:var(--ink-60)}

/* ---------- month notes ---------- */
.nota{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.nota .kop{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-35);margin-bottom:6px}
.nota .kop i{width:8px;height:8px;border-radius:50%;background:var(--bloom);flex:none;font-style:normal}
.nota .kop.snoei i{background:var(--wine)}
.nota .kop.vorst i{background:var(--frost)}
.nota p{margin:0;font-size:14px;line-height:1.5}
.nota p+p{margin-top:6px}
.nota b{font-weight:600}

/* ---------- plant grid ---------- */
.filterrij{position:relative;margin:0 -16px}
.filterrij::after{content:"";position:absolute;top:0;bottom:14px;right:0;width:26px;pointer-events:none;
  background:linear-gradient(90deg,rgba(237,240,232,0),var(--paper))}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 20px 14px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none;height:36px;min-height:36px;font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.kaart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%;height:100%;display:flex;flex-direction:column}
.kaart img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#E4E9DE}
.kaart .body{padding:10px 11px 12px;flex:1;display:flex;flex-direction:column}
.kaart .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15;display:block}
.kaart .lat{font-size:11.5px;color:var(--ink-35);font-style:italic;margin-top:2px;display:block}
.kaart .tag{align-self:flex-start;margin-top:auto;white-space:nowrap;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-60);background:#EEF1EA;border-radius:5px;padding:3px 7px}
.kaart .tag.dorst{background:#F6E9EE;color:var(--wine)}

/* ---------- year ring ---------- */
.ringwrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px 6px;margin-bottom:14px}
.ring{width:100%;height:auto;display:block;touch-action:manipulation}
.ring text{font-family:var(--body);font-size:12px;font-weight:600;fill:var(--ink-60)}
.ring text.on{fill:#fff}
.ring .hit{cursor:pointer}
.legenda{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--ink-60);padding:6px 0 4px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:9px;height:9px;border-radius:50%;font-style:normal}

/* ---------- sheet ---------- */
.sheet{
  position:absolute;inset:0;z-index:60;background:rgba(22,36,27,.5);
  opacity:0;pointer-events:none;transition:opacity .22s
}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;top:14px;overflow-y:auto;overscroll-behavior:contain;
  background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);-webkit-overflow-scrolling:touch
}
.sheet.open .panel{transform:translateY(0)}
.panel .hero{position:relative}
.panel .hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#E4E9DE}
.sluit{
  position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;backdrop-filter:blur(6px)
}
.sluit svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round}
.panel .kop{padding:16px 16px 0}
.panel h2{font-size:25px;font-weight:800;line-height:1.1}
.panel .lat{font-style:italic;color:var(--ink-35);font-size:14px;margin-top:3px}
.feiten{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 16px 0}
.feit{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.feit .k{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-35)}
.feit .v{font-size:13.5px;font-weight:500;margin-top:2px;line-height:1.35}
.feit.let .v{color:var(--wine);font-weight:600}
.blok{padding:0 16px;margin-top:20px}
.blok h3{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-35);margin-bottom:7px;font-family:var(--body)}
.blok p{margin:0 0 8px;font-size:15px;line-height:1.55}
.blok p:last-child{margin-bottom:0}
.tip{background:#F6E9EE;border-left:3px solid var(--bloom);border-radius:0 10px 10px 0;padding:11px 13px;font-size:14px;line-height:1.5;margin-top:4px}
.tip b{font-weight:600;color:var(--wine)}
.prob{border-top:1px solid var(--line)}
.prob:last-child{border-bottom:1px solid var(--line)}
.prob summary{padding:12px 0;font-size:15px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.prob summary::-webkit-details-marker{display:none}
.prob summary::after{content:"+";font-family:var(--display);font-size:20px;color:var(--ink-35);line-height:1}
.prob[open] summary::after{content:"–"}
.prob .uit{padding:0 0 13px;font-size:14.5px;line-height:1.55;color:var(--ink-60)}
.prob .uit b{color:var(--ink);font-weight:600}
.paneldoe{padding:20px 16px calc(28px + var(--safe-b))}
.knop{
  width:100%;min-height:52px;border-radius:13px;background:var(--bloom);color:#fff;
  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em
}
.knop.klaar{background:var(--leaf)}
.knop.uit{background:var(--card);color:var(--ink-60);border:1px solid var(--line)}

/* ---------- tabbar ---------- */
.tabbar{
  flex:0 0 auto;z-index:20;background:var(--paper);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);display:flex
}
.tabbar button{position:relative;flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-35)}
.tabbar button.on{color:var(--wine)}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar span{font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tabbar .bdg[hidden]{display:none}
.tabbar .bdg{position:absolute;top:4px;left:50%;margin-left:5px;font-style:normal;background:var(--bloom);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

.view{display:none}
.view.on{display:block}
.vt{padding-top:4px}
footer{padding:26px 16px 30px;text-align:center;font-size:12px;color:var(--ink-35);line-height:1.6}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2.5px solid var(--bloom);outline-offset:2px;border-radius:6px}

@media(max-width:339px){
  .wrap{padding:0 12px}
  .date{font-size:26px}
  .taak{padding:9px;gap:10px}
  .taak img{width:56px;height:56px}
  .taak .nm{font-size:15px}
  .taak .sub{font-size:12.5px}
  .doe{width:42px;height:42px;min-width:42px}
  .grid{gap:8px}
  .kaart .nm{font-size:14px}
  .feiten{grid-template-columns:1fr}
  .panel h2{font-size:22px}
  .tabbar span{font-size:10px}
}
@media(max-height:620px){
  .top{padding:12px 0 2px}
  .strip{margin:12px 0 4px;height:26px}
  .sec{margin:18px 0 10px}
}
</style>
</head>
<body>
<div class="app">

<div class="scroll" id="scroll">
<div class="wrap">

<!-- ══════════ VANDAAG ══════════ -->
<section class="view on" id="v-vandaag">
  <div class="top">
    <div class="eyebrow" id="eyebrow">Vandaag</div>
    <div class="date" id="datum">—</div>
  </div>

  <div class="weer" id="weer"></div>
  <div class="weerkeuze" id="weerkeuze" hidden></div>

  <div class="strip" id="strip"></div>
  <div class="striplbl"><span>jan</span><span>apr</span><span>jul</span><span>okt</span><span>dec</span></div>

  <div id="alerts"></div>

  <div class="sec"><h2>Water geven</h2><span class="count" id="waterCount"></span></div>
  <div id="taken"></div>

  <div class="sec"><h2 id="maandKop">Deze maand</h2></div>
  <div id="maandwerk"></div>
</section>

<!-- ══════════ PLANTEN ══════════ -->
<section class="view" id="v-planten">
  <div class="top">
    <div class="eyebrow">De tuin en het huis</div>
    <div class="date">Tien planten</div>
  </div>
  <div class="filterrij"><div class="filters" id="filters"></div></div>
  <div class="grid" id="grid"></div>
  <footer>Tik een plant voor de volledige fiche.</footer>
</section>

<!-- ══════════ JAAR ══════════ -->
<section class="view" id="v-jaar">
  <div class="top">
    <div class="eyebrow">Het plantenjaar</div>
    <div class="date" id="jaarKop">—</div>
  </div>
  <div class="ringwrap">
    <svg class="ring" id="ring" viewBox="0 0 300 300" role="img" aria-label="Jaarwiel met bloei, snoei en vorstbescherming per maand"></svg>
    <div class="legenda">
      <span><i style="background:#C4406B"></i>bloei</span>
      <span><i style="background:#5A1B3D"></i>snoei</span>
      <span><i style="background:#3A6E96"></i>vorstwacht</span>
    </div>
  </div>
  <div class="sec"><h2 id="maandTitel">—</h2></div>
  <div id="maandDetail"></div>
</section>

</div>
</div>

<!-- ══════════ FICHE ══════════ -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Plantenfiche">
  <div class="panel" id="panel"></div>
</div>

<!-- ══════════ TABS ══════════ -->
<nav class="tabbar">
  <button data-tab="vandaag" class="on">

    <span>Vandaag</span><em class="bdg" id="bdg" hidden></em>
  </button>
  <button data-tab="planten">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    <span>Planten</span>
  </button>
  <button data-tab="jaar">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg>
    <span>Jaar</span>
  </button>
</nav>
</div>

  snoeiTip:"Kwekers raden aan om de vormsnoei uit te stellen tot april, net als de nieuwe groei begint. Dan zie je meteen welke takjes vorstschade hebben en knip je die in één beurt mee weg.",

  waterTxt:"Twee keer per week, bij zeer zonnig weer elke twee dagen. Houdt van licht vochtige grond, maar niet van water dat blijft staan.",
  licht:"Volle zon — hoe meer zon, hoe roder", grond:"Vochtig maar goed doorlatend",
  vorst:-8, vorstTxt:"Matig winterhard. Gevestigde pollen komen er meestal goed door; laat in de winter het oude blad staan, dat isoleert het hart. In pot is de kluit kwetsbaarder: zet hem beschut.",
  bloei:[8,9,10], bloeiTxt:"Zijn moment is augustus tot oktober, maar het zit in het blad, niet in bloemen: het kleurt dan van groen met rode punt naar dieprood. Echte bloei is zeldzaam, hooguit kleine zilverachtige pluimpjes.",
  snoei:[3], snoeiTxt:"Knip het oude, dorre blad in maart terug tot 10 à 15 cm boven de grond, net voor de nieuwe groei begint.",
  snoeiTip:"Je fiche noemt najaar óf voorjaar. Kies het voorjaar. Wie in het najaar alles wegknipt, haalt de winterisolatie weg en ziet vaker terugval en een trage start.",
  huisdier:"ok", huisdierTxt:"Siergrassen zijn veilig voor honden en katten.",
  weetje:"Woekert niet, in tegenstelling tot veel andere siergrassen — hij vormt nette pollen en blijft waar je hem zet.",
  prob:[
    ["Blad blijft groen in plaats van rood","Te weinig zon. Het rood komt pas goed door bij minstens vier tot zes uur direct licht per dag."],
    ["Traag of schraal uitlopen in het voorjaar","Meestal te vroeg gesnoeid in het najaar, of de kluit is te nat geweest. Zet de pot verhoogd en snoei voortaan pas in maart."],
    ["Groene scheuten tussen het rode blad","Terugslag naar de wilde vorm. Trek die scheuten er meteen uit bij de basis, anders nemen ze de pol over."]
  ]},

  water:{lente:3,zomer:3,herfst:4,winter:12,warm:2},
  waterTxt:"Twee keer per week, bij zeer zonnig weer elke twee dagen. Laat de kluit nooit helemaal uitdrogen.",
  waterTip:"In de winter alleen gieten als het langer droog is én het niet vriest. De grond mag dan licht vochtig zijn, meer niet.",
  licht:"Volle zon", grond:"Goed doorlatend, pot met ruime gaten",
  vorst:-5, vorstTxt:"In volle grond kan deze palm veel meer vorst hebben, maar in een pot bevriezen de wortels veel sneller — daar geldt de −5 °C uit je fiche. Bij strenge vorst de pot inpakken of hem in een onverwarmde garage of schuur zetten.",

  snoei:[], snoeiTxt:"Geen vaste snoeibeurt. Knip alleen bruin, dood of beschadigd blad weg, zo dicht mogelijk bij de stam. Vorm snoeien doe je niet: een palm groeit alleen vanuit zijn hart.",
  huisdier:"ok", huisdierTxt:"Echte palmen zijn veilig. Let alleen op de scherpe stekels op de bladstelen.",
  weetje:"De enige palmsoort die van nature in Europa groeit — van Zuid-Spanje tot Marokko.",
  prob:[
    ["Bruine of zwarte punten op de waaiers","Het eerste teken van vorstschade: de bladcellen zijn bevroren. Knip pas weg als de vorst voorbij is, en dek volgende keer eerder af."],
    ["Hele waaier bruin en verdroogd","Ernstiger, vaak door gure oostenwind die het blad uitdroogt. De palm maakt meestal in het voorjaar nieuw blad vanuit de speer, maar hij is wel verzwakt."],
    ["Slappe, vergelende bladeren in de winter","Te natte kluit. Zorg dat de pot vrij kan uitlekken en giet zo goed als niet tijdens vorstperiodes."]

  water:{lente:7,zomer:7,herfst:14,winter:14,warm:5},
  waterTxt:"Lente en zomer één keer per week. Herfst en winter één keer per twee weken. Laat de bovenste laag potgrond tussendoor opdrogen.",
  licht:"Veel indirect licht, geen felle middagzon", grond:"Luchtige potgrond met goede drainage",
  vorst:null, vorstTxt:"Kamerplant. Zet hem niet in de tocht en niet vlak bij een radiator of een koud raam — plotse temperatuurwissels laten blad vallen.",
  bloei:[], bloeiTxt:"Bloeit niet binnenshuis. De aantrekkingskracht zit in het bonte blad: groen, room en roze.",
  snoei:[], snoeiTxt:"Alleen als hij te hoog wordt. Knip de top boven een blad af in het voorjaar, dan vertakt hij. Er komt melksap uit de wond.",
  snoeiTip:"Stof de bladeren om de paar weken af met een vochtige doek. Een bonte ficus heeft meer licht nodig dan een groene, en een stoflaag kost hem precies dat licht.",
  huisdier:"nee", huisdierTxt:"Giftig voor honden en katten. Alle ficussoorten zijn dat: knabbelen veroorzaakt braken, diarree en overmatig kwijlen. Zet hem buiten bereik.",
  weetje:"Het melksap kan ook bij mensen de huid irriteren. Handschoenen aan als je snoeit.",

    ["Bruine, droge bladranden","Te droge lucht, vaak in de winter door de verwarming. Zet hem verder van de radiator of nevel af en toe."],
    ["De roze en room verdwijnen uit het blad","Te weinig licht. Zet hem dichter bij een raam, maar wel achter een dun gordijn."]

const MND = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const MND3 = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAG = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

/* ═══════════════ OPSLAG ═══════════════ */
const SLEUTEL = "fiche:v1";
let mem = {};

/* Twee opslagplekken, want de app draait in twee omgevingen:
   binnen Claude bestaat window.storage, als los bestand op de telefoon
   alleen de opslag van de browser. We proberen beide, en vallen zo nodig
   terug op het geheugen van deze sessie. */
async function laad(){
  let ruw = null;
  try{ const r = await window.storage.get(SLEUTEL); if(r && r.value) ruw = r.value; }catch(e){}
  if(ruw === null){ try{ ruw = window.localStorage.getItem(SLEUTEL); }catch(e){} }
  try{ mem = ruw ? JSON.parse(ruw) : {}; }catch(e){ mem = {}; }
  if(!mem.gegoten) mem.gegoten = {};
  if(!mem.gedaan) mem.gedaan = {};
}
async function bewaar(){
  const s = JSON.stringify(mem);
  try{ await window.storage.set(SLEUTEL, s); }catch(e){}
  try{ window.localStorage.setItem(SLEUTEL, s); }catch(e){}
}

/* ═══════════════ HULP ═══════════════ */
const nu = new Date();
const maand = nu.getMonth()+1;
const vandaagKey = nu.toISOString().slice(0,10);

function seizoen(m){
  if(m>=3&&m<=5) return "lente";
  if(m>=6&&m<=8) return "zomer";
  if(m>=9&&m<=11) return "herfst";
  return "winter";
}
function dagenGeleden(iso){
  if(!iso) return null;
  return Math.floor((new Date(vandaagKey) - new Date(iso)) / 86400000);
}

/* weer: "normaal" | "warm" | "regen" */
let weer = { staat:"normaal", temp:null, min:null, bron:"handmatig", regen:null };

function interval(p){
  const basis = p.water[seizoen(maand)];
  if(weer.staat === "warm") return Math.min(basis, p.water.warm);
  if(weer.staat === "regen" && p.plek === "buiten") return basis + 3;
  return basis;
}
function dorst(p){
  const g = mem.gegoten[p.id];
  const d = dagenGeleden(g);
  const iv = interval(p);
  if(d === null) return { d:null, iv, over:0, dorstig:true };
  return { d, iv, over:d - iv, dorstig: d >= iv };
}

/* ═══════════════ WEER ═══════════════ */
async function haalWeer(){
  const url = "https://api.open-meteo.com/v1/forecast?latitude=51.22&longitude=4.40"
    + "&current=temperature_2m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum"
    + "&past_days=1&forecast_days=3&timezone=Europe%2FBrussels";
  try{
    const c = new AbortController();
    const t = setTimeout(()=>c.abort(), 6000);
    const r = await fetch(url,{signal:c.signal});
    clearTimeout(t);
    if(!r.ok) throw 0;
    const j = await r.json();
    const max = j.daily.temperature_2m_max[1];
    const regenGisteren = j.daily.precipitation_sum[0];
    const regenVandaag = j.daily.precipitation_sum[1];
    weer.temp = Math.round(j.current.temperature_2m);
    weer.regen = Math.round((regenGisteren + regenVandaag)*10)/10;
    weer.min = Math.min(...j.daily.temperature_2m_min.slice(1,3));
    weer.bron = "meting";
    if(weer.regen >= 6) weer.staat = "regen";
    else if(max >= 24 && regenVandaag < 1) weer.staat = "warm";
    else weer.staat = "normaal";
  }catch(e){
    weer.bron = "handmatig";
    weer.staat = mem.weer || "normaal";
  }
}

/* ═══════════════ VANDAAG ═══════════════ */
function tekenVandaag(){
  document.getElementById("eyebrow").textContent = DAG[nu.getDay()];
  document.getElementById("datum").textContent = nu.getDate() + " " + MND[maand-1];

  /* weerregel */
  const w = document.getElementById("weer");
  const kz = document.getElementById("weerkeuze");
  const woord = {normaal:"Gewoon weer", warm:"Warm en droog", regen:"Het heeft geregend"}[weer.staat];
  if(weer.bron === "meting"){
    w.innerHTML = '<span class="chip">' + weer.temp + '° in Antwerpen <small>' + woord.toLowerCase() + '</small></span>'
      + '<button class="chip" id="wtoggle">Zelf instellen</button>';
    kz.hidden = true;
  }else{
    w.innerHTML = '<span class="chip">' + woord + ' <small>zelf ingesteld</small></span>'
      + '<button class="chip" id="wtoggle">Wijzigen</button>';
  }
  document.getElementById("wtoggle").onclick = ()=>{
    kz.hidden = !kz.hidden;
    if(!kz.hidden) tekenWeerkeuze();
  };
  if(!kz.hidden) tekenWeerkeuze();

  /* jaarstrip */
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  for(let m=1;m<=12;m++){
    const b = document.createElement("button");
    b.className = "seg" + (m===maand ? " now" : m<maand ? " past" : "");
    b.setAttribute("aria-label", MND[m-1]);
    if(P.some(p=>p.snoei.includes(m)) || P.some(p=>p.bloei.includes(m))){
      const pip = document.createElement("span"); pip.className="pip"; b.appendChild(pip);
    }
    b.onclick = ()=>{ gekozenMaand = m; tekenJaar(); tab("jaar"); };
    strip.appendChild(b);
  }

  /* alerts */
  const al = document.getElementById("alerts");
  al.innerHTML = "";
  if(weer.min !== null && weer.min <= 0){
    const risico = P.filter(p=>p.vorst !== null && weer.min <= p.vorst + 2);
    if(risico.length){
      al.innerHTML += '<div class="alert"><h3>Vorst op komst — ' + Math.round(weer.min) + '° de komende nachten</h3>'
        + '<p>Bescherm ' + lijst(risico.map(p=>p.nm)) + '. Vliesdoek eromheen, of de pot tegen de muur en weg van de oostenwind. Potten bevriezen sneller dan volle grond.</p></div>';
    }
  }
  if(weer.staat === "warm"){
    al.innerHTML += '<div class="alert warm"><h3>Warm en droog</h3><p>De buitenplanten schakelen vandaag naar het hitteschema. Giet \'s ochtends vroeg of \'s avonds, niet in de volle middagzon.</p></div>';
  }
  if(weer.staat === "regen" && weer.regen !== null){
    al.innerHTML += '<div class="alert"><h3>' + weer.regen + ' mm regen gevallen</h3><p>De buitenplanten hebben vanzelf water gehad. Hun volgende beurt schuift een paar dagen op — de kamerplanten merken er niets van.</p></div>';
  }

  /* eerste keer */
  const kaal = Object.keys(mem.gegoten).length === 0;
  if(kaal){
    al.innerHTML += '<div class="alert warm"><h3>Eerste keer</h3><p>Vink hieronder af wat je vandaag giet. Vanaf dan rekent de app zelf uit wanneer elke plant weer aan de beurt is.</p>'
      + '<button class="knop" id="startknop" style="margin-top:11px;min-height:44px;font-size:15px">Alles staat goed vandaag</button></div>';
  }

  /* taken */
  const taken = P.map(p=>({p, s:dorst(p)})).filter(x=>x.s.dorstig)
    .sort((a,b)=> (b.s.over) - (a.s.over));
  const box = document.getElementById("taken");
  const nogTeDoen = taken.filter(x=> mem.gedaan[vandaagKey+":"+x.p.id] !== true).length;
  document.getElementById("waterCount").textContent = taken.length ? nogTeDoen + " van " + taken.length : "";
  const bdg = document.getElementById("bdg");
  if(nogTeDoen>0){ bdg.hidden=false; bdg.textContent = nogTeDoen; } else bdg.hidden = true;

  if(!taken.length){
    box.innerHTML = '<div class="leeg"><h3>Niets te gieten vandaag</h3><p>Alle tien de planten hebben genoeg. Kom morgen terug.</p></div>';
  }else{
    box.innerHTML = "";
    taken.forEach(({p,s})=>{
      const klaar = mem.gedaan[vandaagKey+":"+p.id] === true;
      const el = document.createElement("div");
      el.className = "taak" + (klaar ? " gedaan" : "");
      let sub;
      if(s.d === null) sub = "Nog geen gietbeurt genoteerd";
      else if(s.over === 0) sub = "Vandaag aan de beurt";
      else if(s.over === 1) sub = "<b>1 dag over tijd</b>";
      else sub = "<b>" + s.over + " dagen over tijd</b>";
      el.innerHTML =
        '<img src="' + p.img + '" alt="" loading="lazy">' +
        '<div class="mid"><button class="nm" data-open="' + p.id + '">' + p.nm + '</button>' +
        '<div class="sub">' + sub + ' · elke ' + s.iv + ' dagen</div></div>' +
        '<button class="doe" aria-label="Water gegeven aan ' + p.nm + '" aria-pressed="' + klaar + '">' +
        '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';
      el.querySelector(".doe").onclick = ()=> giet(p.id, !klaar);
      el.querySelector("[data-open]").onclick = ()=> openFiche(p.id);
      box.appendChild(el);
    });
  }

  const sk = document.getElementById("startknop");
  if(sk) sk.onclick = async ()=>{
    P.forEach(p=>{ mem.gegoten[p.id] = vandaagKey; });
    await bewaar(); tekenAlles();
  };

  /* maandwerk */
  document.getElementById("maandKop").textContent = "In " + MND[maand-1];
  document.getElementById("maandwerk").innerHTML = maandBlok(maand) ||
    '<div class="leeg"><p>Deze maand staat er niets bijzonders op het programma. Gewoon water geven.</p></div>';
}

function tekenWeerkeuze(){
  const kz = document.getElementById("weerkeuze");
  const opties = [["normaal","Gewoon"],["warm","Warm & droog"],["regen","Geregend"]];
  kz.innerHTML = opties.map(([k,l])=>
    '<button class="chip' + (weer.staat===k?" sel":"") + '" data-w="' + k + '">' + l + '</button>').join("");
  kz.querySelectorAll("[data-w]").forEach(b=> b.onclick = async ()=>{
    weer.staat = b.dataset.w; weer.bron = "handmatig";
    mem.weer = weer.staat; await bewaar(); tekenAlles();
  });
}

function lijst(a){
  if(a.length===1) return a[0];
  return a.slice(0,-1).join(", ") + " en " + a[a.length-1];
}

async function giet(id, aan){
  mem.gedaan[vandaagKey+":"+id] = aan;
  if(aan) mem.gegoten[id] = vandaagKey;
  else delete mem.gegoten[id];
  await bewaar();
  tekenAlles();
}

/* ═══════════════ MAANDWERK ═══════════════ */
function maandBlok(m){
  let h = "";
  const snoei = P.filter(p=>p.snoei.includes(m));
  const bloei = P.filter(p=>p.bloei.includes(m) && !p.bloei.includes(m-1));
  const vorst = (m<=3||m>=11) ? P.filter(p=>p.vorst !== null && p.vorst > -10) : [];

  if(snoei.length){
    h += '<div class="nota"><div class="kop snoei"><i></i>Snoeien</div>' +
      snoei.map(p=>'<p><b>' + p.nm + '</b> — ' + eersteZin(p.snoeiTxt) + '</p>').join("") + '</div>';
  }
  if(bloei.length){
    h += '<div class="nota"><div class="kop"><i></i>Komt op kleur</div><p>' +
      lijst(bloei.map(p=>p.nm)) + '.</p></div>';
  }
  if(vorst.length){
    h += '<div class="nota"><div class="kop vorst"><i></i>Vorstwacht</div><p>Houd de nachtvorst in de gaten voor ' +
      lijst(vorst.map(p=>p.nm)) + '. In pot bevriezen de wortels sneller dan in volle grond.</p></div>';
  }
  return h;
}
function eersteZin(t){
  const i = t.indexOf(". ");
  return i>0 ? t.slice(0,i+1) : t;
}

/* ═══════════════ PLANTEN ═══════════════ */
let filter = "alle";
const FILTERS = [["alle","Alle"],["buiten","Buiten"],["binnen","Binnen"],["dorst","Dorstig"],["huisdier","Huisdierveilig"]];

function tekenPlanten(){
  const f = document.getElementById("filters");
  f.innerHTML = FILTERS.map(([k,l])=>
    '<button class="chip' + (filter===k?" sel":"") + '" data-f="' + k + '">' + l + '</button>').join("");
  f.querySelectorAll("[data-f]").forEach(b=> b.onclick = ()=>{ filter = b.dataset.f; tekenPlanten(); });

  const zicht = P.filter(p=>{
    if(filter==="alle") return true;
    if(filter==="dorst") return dorst(p).dorstig;
    if(filter==="huisdier") return p.huisdier === "ok";
    return p.plek === filter;
  });

  document.getElementById("grid").innerHTML = zicht.map(p=>{
    const s = dorst(p);
    const dg = Math.max(1, -s.over);
    const tag = s.dorstig ? '<span class="tag dorst">Nu gieten</span>'
      : '<span class="tag">Over ' + dg + ' dag' + (dg===1?"":"en") + '</span>';
    return '<button class="kaart" data-open="' + p.id + '">' +
      '<img src="' + p.img + '" alt="' + p.nm + '" loading="lazy">' +
      '<div class="body"><span class="nm">' + p.nm + '</span>' +
      '<span class="lat">' + p.lat + '</span><span style="height:8px"></span>' + tag + '</div></button>';
  }).join("");
  document.querySelectorAll("#grid [data-open]").forEach(b=> b.onclick = ()=> openFiche(b.dataset.open));
}

/* ═══════════════ FICHE ═══════════════ */
function openFiche(id){
  const p = P.find(x=>x.id===id);
  const s = dorst(p);
  const klaar = mem.gedaan[vandaagKey+":"+p.id] === true;
  const hd = {ok:"Veilig", let:"Opletten", nee:"Giftig"}[p.huisdier];

  let h = '<div class="hero"><img src="' + p.img + '" alt="' + p.nm + '">' +
    '<button class="sluit" id="sluitknop" aria-label="Sluiten"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="kop"><h2>' + p.nm + '</h2><div class="lat">' + p.lat + ' · ' + p.vlg + '</div></div>';

  h += '<div class="feiten">' +
    feit("Water nu", s.dorstig ? "Aan de beurt" : "Over " + Math.max(1,-s.over) + " dagen", s.dorstig) +
    feit("Ritme", "Elke " + s.iv + " dagen", false) +
    feit("Licht", p.licht, false) +
    feit("Huisdieren", hd, p.huisdier !== "ok") +
    '</div>';

  h += blok("Water geven", p.waterTxt, p.waterTip);
  h += blok("Snoeien", p.snoeiTxt, p.snoeiTip);
  h += blok(p.plek==="buiten" ? "Winter en vorst" : "Standplaats", p.vorstTxt, null);
  h += blok("Bloei", p.bloeiTxt, null);
  h += blok("Grond", p.grond, null);
  if(p.eetbaar) h += blok("Eetbaar?", p.eetbaar, null);
  h += blok("Huisdieren en kinderen", p.huisdierTxt, null);

  h += '<div class="blok"><h3>Als er iets mis is</h3>' +
    p.prob.map(([q,a])=>'<details class="prob"><summary>' + q + '</summary><div class="uit">' + a + '</div></details>').join("") +
    '</div>';

  h += blok("Weetje", p.weetje, null);

  h += '<div class="paneldoe">' +
    '<button class="knop' + (klaar?" klaar":"") + '" id="gietknop">' +
    (klaar ? "Water gegeven vandaag" : "Water gegeven") + '</button></div>';

  const panel = document.getElementById("panel");
  panel.innerHTML = h;
  panel.scrollTop = 0;
  document.getElementById("sluitknop").onclick = sluitFiche;
  document.getElementById("gietknop").onclick = async ()=>{ await giet(p.id, !klaar); openFiche(p.id); };
  const sh = document.getElementById("sheet");
  sh.classList.add("open");
  sh.onclick = e=>{ if(e.target === sh) sluitFiche(); };
}
function sluitFiche(){
  document.getElementById("sheet").classList.remove("open");
}
function feit(k,v,let_){
  return '<div class="feit' + (let_?" let":"") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}
function blok(t, p1, tip){
  if(!p1) return "";
  return '<div class="blok"><h3>' + t + '</h3><p>' + p1 + '</p>' +
    (tip ? '<div class="tip">' + tip + '</div>' : '') + '</div>';
}

/* ═══════════════ JAARWIEL ═══════════════ */
let gekozenMaand = maand;

function pol(cx,cy,r,graden){
  const a = (graden-90) * Math.PI/180;
  return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
}
function boog(cx,cy,r1,r2,a1,a2){
  const [x1,y1]=pol(cx,cy,r2,a1), [x2,y2]=pol(cx,cy,r2,a2);
  const [x3,y3]=pol(cx,cy,r1,a2), [x4,y4]=pol(cx,cy,r1,a1);
  const groot = (a2-a1) > 180 ? 1 : 0;
  return `M${x1} ${y1}A${r2} ${r2} 0 ${groot} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${groot} 0 ${x4} ${y4}Z`;
}

function tekenJaar(){
  document.getElementById("jaarKop").textContent = nu.getFullYear();
  const svg = document.getElementById("ring");
  const C = 150, s = [];

  for(let m=1;m<=12;m++){
    const a1 = (m-1)*30 + 1.2, a2 = m*30 - 1.2;
    const actief = m === gekozenMaand;

    /* achtergrondsector */
    s.push(`<path d="${boog(C,C,58,132,a1,a2)}" fill="${actief ? "#5A1B3D" : "#F4F6F1"}"/>`);

    /* vorstwacht binnenband */
    if(m<=3 || m>=11) s.push(`<path d="${boog(C,C,60,74,a1,a2)}" fill="${actief ? "#7FA8C4" : "#3A6E96"}" opacity="${actief?.9:.85}"/>`);

    /* bloei buitenband */
    const nb = P.filter(p=>p.bloei.includes(m)).length;
    if(nb) s.push(`<path d="${boog(C,C,110,110+Math.min(20,nb*4),a1,a2)}" fill="#C4406B" opacity="${actief?1:.8}"/>`);

    /* snoeimarkering */
    const ns = P.filter(p=>p.snoei.includes(m)).length;
    if(ns){
      const [dx,dy] = pol(C,C,100,(a1+a2)/2);
      s.push(`<circle cx="${dx}" cy="${dy}" r="${ns>1?5.5:4}" fill="${actief?"#F0C8DA":"#5A1B3D"}" stroke="${actief?"#5A1B3D":"#F4F6F1"}" stroke-width="1.5"/>`);
    }

    /* label */
    const [tx,ty] = pol(C,C,84,(a1+a2)/2);
    s.push(`<text x="${tx}" y="${ty+4}" text-anchor="middle" class="${actief?"on":""}">${MND3[m-1]}</text>`);

    /* trefvlak */
    s.push(`<path class="hit" role="button" tabindex="0" aria-label="${MND[m-1]}" d="${boog(C,C,58,140,a1,a2)}" fill="transparent" data-m="${m}"><title>${MND[m-1]}</title></path>`);
  }

  /* huidige maand: buitenste wijzer */
  const [nx,ny] = pol(C,C,143,(maand-1)*30+15);
  s.push(`<circle cx="${nx}" cy="${ny}" r="5" fill="#16241B"/>`);
  s.push(`<circle cx="${C}" cy="${C}" r="46" fill="#EDF0E8"/>`);
  s.push(`<text x="${C}" y="${C-4}" text-anchor="middle" style="font-size:11px;letter-spacing:.1em;fill:#93A096">NU</text>`);
  s.push(`<text x="${C}" y="${C+16}" text-anchor="middle" style="font-family:var(--display);font-size:19px;font-weight:800;fill:#16241B">${MND3[maand-1]}</text>`);

  svg.innerHTML = s.join("");
  svg.querySelectorAll("[data-m]").forEach(el=>{
    const kies = ()=>{ gekozenMaand = +el.dataset.m; tekenJaar();
       };
    el.onclick = kies;
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); kies(); } };
  });

  document.getElementById("maandTitel").textContent = MND[gekozenMaand-1].charAt(0).toUpperCase() + MND[gekozenMaand-1].slice(1);
  const bloeiers = P.filter(p=>p.bloei.includes(gekozenMaand));
  let h = maandBlok(gekozenMaand);
  if(bloeiers.length){
    h += '<div class="nota"><div class="kop"><i></i>In bloei</div><p>' + lijst(bloeiers.map(p=>p.nm)) + '.</p></div>';
  }
  if(!h) h = '<div class="leeg"><p>Rustige maand. Alleen water geven volgens het seizoensritme.</p></div>';
  document.getElementById("maandDetail").innerHTML = h;
}

/* ═══════════════ TABS ═══════════════ */
function tab(naam){
  document.querySelectorAll(".view").forEach(v=> v.classList.toggle("on", v.id === "v-"+naam));
  document.querySelectorAll(".tabbar button").forEach(b=> b.classList.toggle("on", b.dataset.tab === naam));
  const sc=document.getElementById("scroll"); if(sc) sc.scrollTop=0;
}
document.querySelectorAll(".tabbar button").forEach(b=> b.onclick = ()=>{
  tab(b.dataset.tab);
  if(b.dataset.tab === "planten") tekenPlanten();
  if(b.dataset.tab === "jaar") tekenJaar();
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") sluitFiche(); });

/* ═══════════════ START ═══════════════ */
function tekenAlles(){ tekenVandaag(); tekenPlanten(); tekenJaar(); }

/* Offline-ondersteuning. Alleen zinvol op een echt webadres; op een los
   bestand of binnen Claude mislukt dit stil en dat is prima. */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}

(async function(){
  await laad();
  weer.staat = mem.weer || "normaal";
  tekenAlles();
  await haalWeer();
  tekenAlles();
})();
</script>
